# Vérifie que le site compile sur chaque pull request (sans déployer).
# Même version de Hugo que le déploiement (.github/workflows/hugo.yml).
name: Test Hugo build

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true
      - name: Build
        run: hugo --minify --gc
