{{/* Spécimen d'un pôle : un vrai extrait de nos sorties (texte lu, notice
     structurée, table de géolocalisation, image), jamais une illustration.
     Argument : le dict `specimen` du frontmatter de content/poles/*.md. */}}
{{- with . -}}
<figure class="specimen specimen--{{ .type }}">
  {{ with .titre }}<p class="specimen__titre">{{ . }}</p>{{ end }}
  {{- if eq .type "texte" }}
  <div class="specimen__texte">
    {{ range .lignes }}<p{{ with .lang }} lang="{{ . }}"{{ end }}{{ with .dir }} dir="{{ . }}"{{ end }}>{{ .texte }}</p>{{ end }}
  </div>
  {{ with .traduction }}<p class="specimen__traduction"><span class="label">traduction</span> {{ . }}</p>{{ end }}
  {{- else if eq .type "code" }}
  <pre class="specimen__code"><code>{{ .code }}</code></pre>
  {{- else if eq .type "table" }}
  <div class="specimen__scroll">
    <table class="specimen__table">
      <caption class="sr-only">{{ .titre }}</caption>
      <thead><tr>{{ range .colonnes }}<th scope="col">{{ . }}</th>{{ end }}</tr></thead>
      <tbody>{{ range .lignes }}<tr>{{ range $i, $c := . }}{{ if eq $i 0 }}<th scope="row">{{ $c }}</th>{{ else }}<td>{{ $c }}</td>{{ end }}{{ end }}</tr>{{ end }}</tbody>
    </table>
  </div>
  {{- else if eq .type "image" }}
  <div class="specimen__image">{{ partial "figure.html" (dict "src" .image "alt" .alt "largeur" 720) }}</div>
  {{ with .lecture }}{{ partial "lecture.html" . }}{{ end }}
  {{ with .lignes }}<div class="specimen__texte">{{ range . }}<p{{ with .lang }} lang="{{ . }}"{{ end }}{{ with .dir }} dir="{{ . }}"{{ end }}>{{ .texte }}</p>{{ end }}</div>{{ end }}
  {{- end }}
  {{ with .source }}<figcaption class="specimen__source">{{ . }}</figcaption>{{ end }}
</figure>
{{- end -}}
