# Trombinoscope (page /association/ ; les experts apparaissent aussi sur la page de leur pôle).
#
# ⚠ PUBLICATION : une personne n'apparaît sur le site EN LIGNE que si `accord: true`
#   (accord écrit pour la diffusion de son nom, et de sa photo s'il y en a une).
#   En local (`hugo server`), tout le monde s'affiche, les fiches sans accord sont signalées.
# ⚠ PHOTOS : en ligne, elles ne s'affichent que si `params.equipe_photos = true` (hugo.toml),
#   à activer quand tout le monde en a une (un trombinoscope à moitié illustré fait négligé).
#
# Schéma :
#   - nom: "Prénom Nom"
#     groupe: "bureau" | "etendu" | ""   # bureau élu (PV d'AG) / bureau étendu / expert seul
#     role: "Président"                 # fonction ; vide pour un expert seul
#     poles: ["geolocalisation"]        # pôles dont la personne est experte (slugs de content/poles/)
#     parcours: "…"                     # facultatif
#     photo: "images/equipe/xxx.jpg"    # facultatif, dans assets/ (portrait, affiché en noir et blanc)
#     lien: "https://…"                 # facultatif
#     accord: false
#
# Sources : PV de l'AG du 03/11/2026 et liste des dirigeants (admin/) pour le bureau élu ;
# mail du nouveau bureau et journal de bord (11/11/2026) pour le bureau étendu et les experts.
# Accords recueillis par Mathieu (18/11/2026 ; Chahan le 20/11/2026). Cursus donnés par Mathieu (19/11/2026).
# Photos (19/11/2026) : LinkedIn, fournies et attribuées par Mathieu ; Owen et Chahan = portraits de la page de l'École ;
# Mathias = recadrage d'une photo de groupe (basse définition). Pas de photo pour les experts hors bureau (décision 19/11).
annee: "2026-2027"
